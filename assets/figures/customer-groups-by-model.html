<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEOBench - Best Run Customer Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000000;
    --ink-2: #000000;
    --ink-3: #000000;
    --line: #d6dde6;
    --line-2: #eef1f5;
    --paper: #ffffff;
    --bg: #ffffff;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 816px;
    height: 320px;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 816px;
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
  }
  .tile {
    background: var(--paper);
    border: 0;
    border-radius: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
  }
  .tile .body { padding: 0; }
  .tile .body svg { display: block; width: 100%; height: auto; }

  svg text { font-family: 'Inter', sans-serif; }
  .yt { font-size: 10.5px; fill: #000000; font-weight: 400; }
  .xt { font-size: 10px; fill: #000000; font-weight: 400; }
  .axt { font-size: 11.5px; fill: #000000; font-weight: 400; }
  .panel-title { font-size: 13px; fill: #000000; font-weight: 400; }
  .legend-title { font-size: 11.5px; fill: #000000; font-weight: 400; }
  .legend { font-size: 8.5px; fill: #000000; font-weight: 400; }
  .customer-tooltip {
    position: absolute;
    z-index: 10;
    min-width: 194px;
    max-width: 238px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid #d6dde6;
    box-shadow: 0 10px 24px rgba(10, 37, 64, 0.14);
    color: #000000;
    font-size: 10.5px;
    line-height: 1.35;
    pointer-events: none;
  }
  .customer-tooltip[hidden] {
    display: none;
  }
  .tooltip-title {
    font-weight: 800;
    margin-bottom: 2px;
  }
  .tooltip-subtitle {
    margin-bottom: 6px;
    color: #333333;
  }
  .tooltip-group {
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr) auto;
    gap: 5px;
    align-items: center;
  }
  .tooltip-group + .tooltip-group {
    margin-top: 3px;
  }
  .tooltip-swatch {
    width: 7px;
    height: 7px;
  }
  .tooltip-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tooltip-value {
    font-weight: 700;
  }
  @page {
    size: 816px 320px;
    margin: 0;
  }
  @media print {
    html,
    body {
      width: 816px;
      height: 320px;
    }
    .page {
      margin: 0;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="tile">
    <div class="body"><div id="plot"></div></div>
  </div>
  <div class="customer-tooltip" id="customer-tooltip" hidden></div>
</div>

<script>
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const n = document.createElementNS(SVG_NS, tag);
  attrs = attrs || {};
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

const GROUP_META = [
  {id:'S1',    label:'Individual 1', color:'#0072B2'},
  {id:'S2',    label:'Individual 2', color:'#D55E00'},
  {id:'S3',    label:'Individual 3', color:'#009E73'},
  {id:'D_S03', label:'Discoverable Individual 1', color:'#56B4E9'},
  {id:'D_S04', label:'Discoverable Individual 2', color:'#E69F00'},
  {id:'D_S07', label:'Discoverable Individual 3', color:'#7F3F98'},
  {id:'D_S10', label:'Discoverable Individual 4', color:'#8A8F98'},
];
const GROUP_ORDER = GROUP_META.map(g => g.id);
const GROUP_COLORS = GROUP_META.reduce((acc, g) => {
  acc[g.id] = g.color;
  return acc;
}, {});

const W = 816, H = 320;
const LEGEND_W = 172;
const PANEL_W = (W - LEGEND_W) / 2;
const PAD_L = 58, PAD_R = 10, PAD_T = 34, PAD_B = 42;
const INNER_W = PANEL_W - PAD_L - PAD_R;
const INNER_H = H - PAD_T - PAD_B;
const X_MAX = 500;
const Y_MAX = 300000;
const Y_TICKS = [0, 50000, 100000, 150000, 200000, 250000, 300000];
const X_TICKS = [0, 100, 200, 300, 400, 500];

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines.shift().split(',');
  return lines.map(line => {
    const cols = line.split(',');
    const row = {};
    headers.forEach((h, i) => { row[h] = cols[i]; });
    return {
      model: row.model,
      runId: row.run_id,
      finalCash: Number(row.final_cash),
      currentDay: Number(row.current_day),
      day: Number(row.day),
      group: row.group_id,
      count: Number(row.count),
    };
  }).filter(r =>
    r.model && r.group &&
    Number.isFinite(r.day) &&
    Number.isFinite(r.count)
  );
}

function formatCount(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (v >= 1000) return Math.round(v / 1000) + 'k';
  return String(Math.round(v));
}

function normalizePanel(rows, model) {
  const modelRows = rows.filter(r => r.model === model);
  const currentDay = modelRows.reduce((m, r) => Math.max(m, r.currentDay || 0), 0);
  const dayMap = {};
  modelRows.forEach(r => {
    if (r.day > currentDay) return;
    if (!dayMap[r.day]) dayMap[r.day] = {};
    dayMap[r.day][r.group] = r.count;
  });
  if (!dayMap[0]) dayMap[0] = {};
  GROUP_ORDER.forEach(g => {
    if (dayMap[0][g] == null) dayMap[0][g] = 0;
  });

  const days = Object.keys(dayMap).map(Number).sort((a, b) => a - b);
  const stacked = days.map(day => {
    let base = 0;
    const items = GROUP_ORDER.map(group => {
      const val = dayMap[day][group] || 0;
      const item = {group, val, base, top: base + val};
      base += val;
      return item;
    });
    return {day, total: base, items};
  });
  const peak = stacked.reduce((best, row) => row.total > best.total ? row : best, {day:0, total:0});
  return {
    model,
    currentDay,
    stacked,
    peak,
  };
}

function drawLegend(svg) {
  const x = W - LEGEND_W + 12;
  const title1 = el('text', {x, y:37, class:'legend-title'}, svg);
  title1.textContent = 'Customer';
  const title2 = el('text', {x, y:51, class:'legend-title'}, svg);
  title2.textContent = 'groups';
  GROUP_META.forEach((g, i) => {
    const y = 76 + i * 20;
    el('rect', {x, y:y - 8, width:9, height:9, fill:g.color, opacity:0.82}, svg);
    const t = el('text', {x:x + 14, y, class:'legend'}, svg);
    t.textContent = g.label;
  });
}

function drawPanel(svg, panel, idx, tooltip) {
  const x0 = idx * PANEL_W;
  const plotX0 = x0 + PAD_L;
  const plotX1 = x0 + PANEL_W - PAD_R;
  const plotY0 = PAD_T;
  const plotY1 = H - PAD_B;
  const xS = d => plotX0 + Math.max(0, Math.min(X_MAX, d)) / X_MAX * INNER_W;
  const yS = v => plotY1 - Math.max(0, Math.min(Y_MAX, v)) / Y_MAX * INNER_H;

  const title = el('text', {x:plotX0, y:15, class:'panel-title'}, svg);
  title.textContent = panel.model;

  Y_TICKS.forEach(tick => {
    const y = yS(tick);
    el('line', {
      x1:plotX0, x2:plotX1, y1:y, y2:y,
      stroke:tick === 0 ? '#0a2540' : '#d6dde6',
      'stroke-width':tick === 0 ? 1 : 0.75,
      'stroke-dasharray':tick === 0 ? '' : '2 3'
    }, svg);
    const label = el('text', {x:plotX0 - 6, y:y + 3.5, class:'yt', 'text-anchor':'end'}, svg);
    label.textContent = formatCount(tick);
  });

  el('line', {x1:plotX0, x2:plotX0, y1:plotY0 - 2, y2:plotY1 + 2, stroke:'#0a2540', 'stroke-width':1}, svg);
  el('line', {x1:plotX0 - 2, x2:plotX1 + 2, y1:plotY1, y2:plotY1, stroke:'#0a2540', 'stroke-width':1}, svg);

  X_TICKS.forEach(tick => {
    const x = xS(tick);
    el('line', {x1:x, x2:x, y1:plotY1, y2:plotY1 + 3, stroke:'#0a2540', 'stroke-width':0.8}, svg);
    const label = el('text', {x, y:plotY1 + 13, class:'xt', 'text-anchor':'middle'}, svg);
    label.textContent = tick;
  });

  GROUP_ORDER.forEach((group, gi) => {
    const top = panel.stacked.map(row => row.items[gi].top);
    const base = panel.stacked.map(row => row.items[gi].base);
    let d = '';
    panel.stacked.forEach((row, i) => {
      d += (i === 0 ? 'M' : 'L') + xS(row.day).toFixed(1) + ' ' + yS(top[i]).toFixed(1) + ' ';
    });
    for (let i = panel.stacked.length - 1; i >= 0; i--) {
      d += 'L' + xS(panel.stacked[i].day).toFixed(1) + ' ' + yS(base[i]).toFixed(1) + ' ';
    }
    d += 'Z';
    el('path', {
      d,
      fill:GROUP_COLORS[group],
      'fill-opacity':0.76,
      stroke:GROUP_COLORS[group],
      'stroke-width':0.45,
      'stroke-linejoin':'round'
    }, svg);
  });

  const hoverGroup = el('g', {opacity:0}, svg);
  const hoverLine = el('line', {
    x1:plotX0,
    x2:plotX0,
    y1:plotY0,
    y2:plotY1,
    stroke:'#0a2540',
    'stroke-width':1,
    'stroke-dasharray':'3 3',
    opacity:0.8
  }, hoverGroup);
  const overlay = el('rect', {
    x:plotX0,
    y:plotY0,
    width:INNER_W,
    height:INNER_H,
    fill:'transparent',
    'pointer-events':'all'
  }, svg);

  function nearestRow(svgX) {
    const day = Math.max(0, Math.min(X_MAX, Math.round((svgX - plotX0) / INNER_W * X_MAX)));
    return panel.stacked.reduce((best, row) => (
      Math.abs(row.day - day) < Math.abs(best.day - day) ? row : best
    ), panel.stacked[0]);
  }

  function showTooltip(event) {
    const rect = svg.getBoundingClientRect();
    const svgX = (event.clientX - rect.left) * W / rect.width;
    if (svgX < plotX0 || svgX > plotX1) {
      hideTooltip();
      return;
    }

    const row = nearestRow(svgX);
    const x = xS(row.day);
    hoverLine.setAttribute('x1', x);
    hoverLine.setAttribute('x2', x);
    hoverGroup.setAttribute('opacity', '1');

    const groups = row.items
      .filter(item => item.val > 0)
      .slice()
      .sort((a, b) => b.val - a.val)
      .slice(0, 4);

    tooltip.innerHTML = `
      <div class="tooltip-title">${panel.model}</div>
      <div class="tooltip-subtitle">Day ${row.day} · ${formatCount(row.total)} active customers</div>
      ${groups.map(item => {
        const meta = GROUP_META.find(g => g.id === item.group);
        return `<div class="tooltip-group">
          <span class="tooltip-swatch" style="background:${GROUP_COLORS[item.group]}"></span>
          <span class="tooltip-label">${meta ? meta.label : item.group}</span>
          <span class="tooltip-value">${formatCount(item.val)}</span>
        </div>`;
      }).join('')}
    `;
    tooltip.hidden = false;

    const pageRect = tooltip.parentElement.getBoundingClientRect();
    const preferredLeft = event.clientX - pageRect.left + 14;
    const preferredTop = event.clientY - pageRect.top + 12;
    const maxLeft = W - tooltip.offsetWidth - 8;
    const maxTop = H - tooltip.offsetHeight - 8;
    tooltip.style.left = Math.max(8, Math.min(preferredLeft, maxLeft)) + 'px';
    tooltip.style.top = Math.max(8, Math.min(preferredTop, maxTop)) + 'px';
  }

  function hideTooltip() {
    hoverGroup.setAttribute('opacity', '0');
    tooltip.hidden = true;
  }

  overlay.addEventListener('pointermove', showTooltip);
  overlay.addEventListener('pointerenter', showTooltip);
  overlay.addEventListener('pointerleave', hideTooltip);

  const xLab = el('text', {x:plotX0 + INNER_W / 2, y:H - 8, class:'axt', 'text-anchor':'middle'}, svg);
  xLab.textContent = 'Day';
  if (idx === 0) {
    const yLab = el('text', {
      x:-(plotY0 + INNER_H / 2),
      y:14,
      class:'axt',
      'text-anchor':'middle',
      transform:'rotate(-90)'
    }, svg);
    yLab.textContent = 'Active customers';
  }
}

function draw(rows) {
  const mount = document.getElementById('plot');
  const tooltip = document.getElementById('customer-tooltip');
  mount.textContent = '';
  tooltip.hidden = true;
  const svg = el('svg', {viewBox:'0 0 ' + W + ' ' + H, width:W, height:H, preserveAspectRatio:'xMinYMin meet'}, mount);
  drawLegend(svg);
  ['Claude Opus 4.8', 'Claude Fable 5'].forEach((model, i) => {
    drawPanel(svg, normalizePanel(rows, model), i, tooltip);
  });
}

function drawError(message) {
  const mount = document.getElementById('plot');
  const svg = el('svg', {viewBox:'0 0 ' + W + ' ' + H, width:W, height:H, preserveAspectRatio:'xMinYMin meet'}, mount);
  const t = el('text', {x:W / 2, y:H / 2, class:'axt', 'text-anchor':'middle'}, svg);
  t.textContent = message;
}

fetch('best_run_customer_groups_by_model.csv?v=6')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(text => draw(parseCsv(text)))
  .catch(err => drawError('Unable to load best_run_customer_groups_by_model.csv (' + err.message + ')'));
</script>
</body>
</html>
