<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEOBench - Skill Bars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
	    --ink: #000000;
	    --ink-2: #000000;
	    --ink-3: #000000;
    --line: #d6dde6;
    --line-2: #cbd3df;
    --paper: #ffffff;
    --bg: #ffffff;
    --brand: #2f6df6;
    --brand-soft: #d8e6ff;
    --orange: #ed5b2c;
    --orange-soft: #ffe7dc;
    --green: #00875a;
    --amber: #b15c00;
    --amber-soft: #ffe9c9;
    --teal: #0c6fa6;
    --teal-soft: #dcf0fb;
    --gray: #8792a2;
    --gray-soft: #eaf6ee;
    --green-soft: #d6f5e6;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 816px;
    margin: 0 auto;
    padding: 0;
    box-sizing: border-box;
  }
  .page.single {
    width: 204px;
    padding: 0;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(4, 204px);
    gap: 0;
    align-items: stretch;
  }
  .page.single .row {
    display: block;
  }
  .page.single .panel {
    width: 204px;
  }
  .panel {
    min-width: 0;
  }
  .tile {
    background: var(--paper);
    border: 0;
    border-radius: 0;
    overflow: visible;
  }
  .tile .body {
    padding: 0;
  }
  .tile svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .legend-row {
    height: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    font-size: 11px;
	    font-weight: 400;
	    color: #000000;
  }
  .page.single .legend-row {
    height: 30px;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-content: flex-start;
    gap: 3px 8px;
    padding: 4px 0 0 18px;
    font-size: 8.5px;
    line-height: 1.05;
    box-sizing: border-box;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    border: 0.8px solid #0a2540;
    display: inline-block;
  }
  .page.single .legend-swatch {
    width: 7px;
    height: 7px;
  }
  .caption {
    display: none;
  }
  @page {
    size: 816px 236px;
    margin: 0;
  }
  @media print {
    html,
    body {
      width: 816px;
      height: 236px;
    }
    .page {
      width: 816px;
      padding: 0;
      margin: 0;
    }
  }
	  svg text {
	    font-family: 'Inter', sans-serif;
	  }
	  .yt {
	    font-size: 12px;
	    fill: #000000;
	  }
	  .xt {
	    font-size: 11.5px;
	    fill: #000000;
	    font-weight: 400;
	  }
	  .axt {
	    font-size: 11px;
	    fill: #000000;
	    font-weight: 800;
	  }
	  .val {
	    font-family: 'Inter', system-ui, sans-serif;
	    font-size: 11px;
	    fill: #000000;
	    font-weight: 400;
	    font-variant-numeric: tabular-nums;
	  }
	  .std {
	    font-family: 'Inter', system-ui, sans-serif;
	    font-size: 8.5px;
	    fill: #000000;
	    font-weight: 400;
	  }
	  .legend {
	    font-size: 11px;
	    fill: #000000;
	    font-weight: 400;
	  }
	  .dir {
	    font-family: 'Inter', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
	    font-size: 12px;
	    fill: #000000;
	    font-weight: 400;
	  }
	  .panel-label {
	    font-size: 12px;
	    fill: #000000;
	    font-weight: 400;
	  }
</style>
</head>
<body>

<div class="page" id="page">
  <div class="row">
    <div class="panel" data-plot="A">
      <div class="tile"><div class="body"><div id="plotA"></div></div></div>
    </div>
    <div class="panel" data-plot="B">
      <div class="tile"><div class="body"><div id="plotB"></div></div></div>
    </div>
    <div class="panel" data-plot="C">
      <div class="tile"><div class="body"><div id="plotC"></div></div></div>
    </div>
    <div class="panel" data-plot="D">
      <div class="tile"><div class="body"><div id="plotD"></div></div></div>
    </div>
  </div>
  <div class="legend-row" id="legend"></div>
</div>

<script>
const GROUPS = [
  {key:'opus48',  label:'Claude Opus 4.8',  short:['Claude', 'Opus 4.8'], color:'#c41e3a', fill:'#f28ea0'},
  {key:'gpt',     label:'GPT 5.5',          short:['GPT 5.5'],             color:'#2f6df6', fill:'#86adff'},
  {key:'opus',    label:'Claude Opus 4.7',  short:['Claude', 'Opus 4.7'], color:'#ed5b2c', fill:'#ffad8d'},
  {key:'other',   label:'Other models',     short:['Other'],               color:'#697386', fill:'#bcc8d6'},
];

const requestedPlot = new URLSearchParams(window.location.search).get('plot');
if(requestedPlot){
  document.getElementById('page').classList.add('single');
  document.querySelectorAll('.panel').forEach(panel => {
    if(panel.dataset.plot !== requestedPlot.toUpperCase()) panel.remove();
  });
}

const PLOTS = [
  {
    mountId: 'plotA',
    panelLabel: '(a)',
    yLabel: 'Ads allocation efficiency',
    kind: 'pct',
    yMax: 0.65,
    ticks: [0, 0.2, 0.4, 0.6],
	    baseline: {y: 0.2, label: 'Random guess', legendPosition: 'topRight'},
    direction: 'up',
    bars: [
      {key:'opus48', mean:0.429072, sd:0.138564, n:3},
      {key:'gpt', mean:0.333733, sd:0.005937, n:3},
      {key:'opus', mean:0.138500, sd:0.074473, n:3},
      {key:'other', mean:0.096756, sd:0.076078, n:18},
    ]
  },
  {
    mountId: 'plotB',
    panelLabel: '(b)',
    yLabel: 'Four-week forecast error',
    kind: 'pct',
    yMax: 7.0,
    ticks: [0, 1, 2, 3, 4, 5, 6, 7],
    padL: 62,
    yLabelOffset: 19,
    direction: 'down',
    bars: [
      {key:'opus48', mean:0.075265, sd:0.051668, n:3},
      {key:'gpt', mean:0.249233, sd:0.156431, n:3},
      {key:'opus', mean:0.479933, sd:0.248756, n:3},
      {key:'other', mean:1.794384, sd:3.892406, n:19},
    ]
  },
  {
    mountId: 'plotC',
    panelLabel: '(c)',
    yLabel: ['Detect-competitor lag', '(weeks)'],
    kind: 'weeks',
    yMax: 4.0,
    ticks: [0, 1, 2, 3, 4],
    yLabelOffset: 24,
    direction: 'down',
    bars: [
      {key:'opus48', mean:1.000000, sd:0.000000, n:3},
      {key:'gpt', mean:1.000000, sd:0.000000, n:2},
      {key:'opus', mean:1.000000, sd:0.000000, n:3},
      {key:'other', mean:2.000000, sd:1.322876, n:17},
    ]
  },
  {
    mountId: 'plotD',
    panelLabel: '(d)',
    yLabel: ['Weekly avg. count of "if"', 'in agent memo'],
    kind: 'count',
    yMax: 10,
    ticks: [0, 2, 4, 6, 8, 10],
    yLabelOffset: 20,
    bars: [
      {key:'opus48', mean:8.574, sd:0.231, n:3},
      {key:'gpt', mean:7.47, sd:1.37, n:3},
      {key:'opus', mean:2.74, sd:0.48, n:3},
      {key:'other', mean:2.63, sd:2.37, n:21},
    ]
  },
];

const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}, parent){
  const n = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}

function fmt(v, kind){
  if(kind === 'pct') return Math.round(v * 100) + '%';
  if(kind === 'weeks') return Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1);
  if(kind === 'count') return v.toFixed(2);
  return v < 1 ? v.toFixed(2) : v.toFixed(1);
}

function tickFmt(v, kind){
  if(kind === 'pct') return Math.round(v * 100) + '%';
  if(kind === 'weeks') return v.toFixed(0);
  return v.toFixed(0);
}

function drawBarPlot(cfg){
	  const singlePlot = Boolean(requestedPlot);
	  const W = 204, H = singlePlot ? 118 : 210;
	  const PAD_L = cfg.padL || 48, PAD_R = 6, PAD_T = singlePlot ? 34 : 50, PAD_B = singlePlot ? 8 : 32;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;
  const yMin = 0, yMax = cfg.yMax;
  const y = v => PAD_T + innerH - (Math.max(yMin, Math.min(yMax, v)) - yMin) / (yMax - yMin) * innerH;

  const mount = document.getElementById(cfg.mountId);
  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:'xMinYMin meet'});
  mount.appendChild(svg);

  cfg.ticks.forEach(tick => {
    const yy = y(tick);
    el('line', {x1:PAD_L, x2:W-PAD_R, y1:yy, y2:yy, stroke:'#d6dde6', 'stroke-width':0.8, 'stroke-dasharray':'2 3'}, svg);
    const tx = el('text', {x:PAD_L-6, y:yy+3.5, class:'yt', 'text-anchor':'end'}, svg);
    tx.textContent = tickFmt(tick, cfg.kind);
  });

  const axY = PAD_T + innerH;
  el('line', {x1:PAD_L, x2:PAD_L, y1:PAD_T-2, y2:axY+2, stroke:'#0a2540', 'stroke-width':1}, svg);
  el('line', {x1:PAD_L-2, x2:W-PAD_R+2, y1:axY, y2:axY, stroke:'#0a2540', 'stroke-width':1}, svg);

	  const titleLines = Array.isArray(cfg.yLabel) ? cfg.yLabel : [cfg.yLabel];
	  const titleY = singlePlot ? (titleLines.length > 1 ? 13 : 24) : (titleLines.length > 1 ? 23 : 34);
	  const title = el('text', {x:PAD_L + innerW / 2, y:titleY, class:'axt', 'text-anchor':'middle'}, svg);
	  titleLines.forEach((line, i) => {
	    const tspan = el('tspan', {
	      x: PAD_L + innerW / 2,
	      y: titleY + i * (singlePlot ? 10 : 12)
	    }, title);
	    tspan.textContent = line;
	  });

	  if(cfg.direction){
	    const dir = el('text', {x:PAD_L - 9, y:titleLines.length > 1 ? 30 : 38, class:'dir', 'text-anchor':'middle'}, svg);
	    dir.textContent = cfg.direction === 'up' ? '👍' : '👎';
	  }

  const gap = singlePlot ? 9 : 11;
  const barW = singlePlot ? 17 : 18;
  const totalW = barW * GROUPS.length + gap * (GROUPS.length - 1);
  const startX = PAD_L + (innerW - totalW) / 2;

  cfg.bars.forEach((d, i) => {
    const g = GROUPS.find(x => x.key === d.key);
    const x = startX + i * (barW + gap);
    const y0 = y(0);
    const yMean = y(d.mean);
    const h = Math.max(1, y0 - yMean);
    const top = y(Math.min(yMax, d.mean + d.sd));
    const bot = y(Math.max(0, d.mean - d.sd));
    const cx = x + barW / 2;

    el('rect', {x, y:yMean, width:barW, height:h, rx:2, fill:g.fill}, svg);
    el('line', {x1:cx, x2:cx, y1:top, y2:bot, stroke:'#0a2540', 'stroke-width':1.2}, svg);
    el('line', {x1:cx-5, x2:cx+5, y1:top, y2:top, stroke:'#0a2540', 'stroke-width':1.2}, svg);
    el('line', {x1:cx-5, x2:cx+5, y1:bot, y2:bot, stroke:'#0a2540', 'stroke-width':1.2}, svg);

    const valueY = Math.min(yMean, top) - (singlePlot ? 5 : 7);
    const v = el('text', {x:cx, y:valueY, class:'val', 'text-anchor':'middle'}, svg);
    v.textContent = fmt(d.mean, cfg.kind);
  });

	  if(cfg.baseline){
	    const by = y(cfg.baseline.y);
	    el('line', {x1:PAD_L, x2:W-PAD_R, y1:by, y2:by, stroke:'#0a2540', 'stroke-width':1.2, 'stroke-dasharray':'2 3', opacity:0.9}, svg);
	    const topRightLegend = cfg.baseline.legendPosition === 'topRight';
	    const lx = topRightLegend ? W - PAD_R - 95 : PAD_L + 14;
	    const ly = cfg.baseline.legendPosition === 'topRight' ? PAD_T + 11 : 44;
	    el('line', {x1:lx, x2:lx+14, y1:ly, y2:ly, stroke:'#0a2540', 'stroke-width':1.2, 'stroke-dasharray':'2 3'}, svg);
	    const leg = el('text', {
	      x: topRightLegend ? W - PAD_R - 2 : lx + 18,
	      y: ly + 3.5,
	      class:'legend',
	      'text-anchor': topRightLegend ? 'end' : 'start'
	    }, svg);
	    leg.textContent = cfg.baseline.label;
  }

  if (!requestedPlot) {
    const panelLabel = el('text', {x:PAD_L + innerW / 2, y:H - 8, class:'panel-label', 'text-anchor':'middle'}, svg);
    panelLabel.textContent = cfg.panelLabel;
  }
}

function drawLegend(){
  const legend = document.getElementById('legend');
  if (!legend) return;
  legend.innerHTML = GROUPS.map(g => (
    `<span class="legend-item"><span class="legend-swatch" style="background:${g.fill}"></span>${g.label}</span>`
  )).join('');
}

PLOTS
  .filter(plot => !requestedPlot || plot.mountId === 'plot' + requestedPlot.toUpperCase())
  .forEach(drawBarPlot);
drawLegend();
</script>
</body>
</html>
