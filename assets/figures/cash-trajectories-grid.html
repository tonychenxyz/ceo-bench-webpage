<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEOBench — Cash Trajectories per Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000000;
    --ink-2: #000000;
    --ink-3: #000000;
    --line: #d6dde6;
    --line-2: #eef1f5;
    --paper: #ffffff;
    --bg: #ffffff;
    --brand: #2f6df6;
    --orange: #ed5b2c;
    --green: #00875a;
    --amber: #b15c00;
    --teal: #0c6fa6;
    --gray: #000000;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    position: relative;
    width: 740px;
    margin: 0 auto;
    padding: 8px;
    box-sizing: border-box;
  }
  .page-head {
    display: none;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 6px;
  }
  .tile {
    background: var(--paper);
    border: 0;
    border-radius: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
  }
  .tile .head {
    padding: 0 0 2px 42px;
    background: transparent;
    border: 0;
    font-weight: 400;
    font-size: 11.5px;
    line-height: 1.1;
    color: var(--ink);
    white-space: nowrap;
  }
  .tile .head .name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .head .pill {
    display: none;
  }
  .tile .body { padding: 0; }
  .tile .body svg { display: block; width: 100%; height: auto; cursor: crosshair; }

  svg text { font-family: 'Inter', sans-serif; fill: #000000; font-weight: 400; }
  .yt  { font-size: 9.5px; fill: #000000; font-weight: 400; }
  .xt  { font-size: 9px; fill: #000000; font-weight: 400; }
  .axt { font-size: 10.5px; fill: #000000; font-weight: 400; }
  .rl  { font-size: 9.5px; font-weight: 400; fill: #000000; }
  .detail-tooltip {
    position: absolute;
    z-index: 20;
    min-width: 172px;
    max-width: 224px;
    padding: 8px 9px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 10px 24px rgba(10, 37, 64, 0.14);
    color: var(--ink);
    pointer-events: none;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.1s, transform 0.1s;
  }
  .detail-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .detail-title {
    color: var(--ink);
    font-size: 10.5px;
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 5px;
  }
  .tile .head .name sup,
  .detail-title sup {
    font-size: 0.72em;
    line-height: 0;
    vertical-align: super;
  }
  .detail-row {
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr) auto;
    gap: 6px;
    align-items: center;
    color: var(--ink-2);
    font-size: 10px;
    font-weight: 400;
    line-height: 1.25;
  }
  .detail-row + .detail-row { margin-top: 3px; }
  .detail-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
  }
  .detail-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .detail-value {
    color: var(--ink);
    font-weight: 400;
    white-space: nowrap;
  }

  @media print {
    @page { size: letter; margin: 0.35in; }
    body  { background: #fff; }
    .page { margin: 0 auto; padding: 0; }
    .detail-tooltip { display: none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="page-head">
    <div class="title">Cash on hand per model</div>
    <div class="sub">All trajectories</div>
  </div>
  <div id="grid" class="grid"></div>
</div>

<script src="runs-by-model.js?v=15"></script>
<script>
const SVG_NS='http://www.w3.org/2000/svg';
function el(t,a={},p){const n=document.createElementNS(SVG_NS,t);for(const k in a)n.setAttribute(k,a[k]);if(p)p.appendChild(n);return n;}
function modelNameHtml(name) {
  return name;
}

// Same Okabe–Ito palette as the master plot, used for the model color.
const PALETTE = {
  'Claude Fable 5':    {c:'#111827'},
  'GPT-5.6 Sol':       {c:'#0072b2'},
  'Claude Opus 4.8':   {c:'#d55e00'},
  'Qwen 3.7 Max':      {c:'#8a63d2'},
  'Gemini 3.5 Flash':  {c:'#2f6df6'},
  'Claude Opus 4.7':   {c:'#cc79a7'},
  'Claude Sonnet 5':   {c:'#009e73'},
  'Claude Haiku 4.5':  {c:'#0c6fa6'},
  'GLM 5.2':           {c:'#7c2d6f'},
  'Kimi K2.6':         {c:'#b15c00'},
  'Claude Sonnet 4.6': {c:'#00875a'},
  'GPT-5.5':           {c:'#e69f00'},
  'Grok 4.5':          {c:'#0097a7'},
  'GLM 5.1':           {c:'#bf4f8f'},
  'DeepSeek V4 Pro':   {c:'#0a2540'},
  'Gemini 3 Flash':    {c:'#697386'},
  'Kimi K3':           {c:'#3f8f8f'},
  'Grok 4.20':         {c:'#6f52c1'},
};
// All runs use solid lines.
const RUN_DASH = ['', '', ''];

// Match the leaderboard table order, excluding non-run summary rows.
const MODEL_ORDER = [
  'Kimi K3',
  'Claude Fable 5',
  'GPT-5.6 Sol',
  'Claude Opus 4.8',
  'Qwen 3.7 Max',
  'Gemini 3.5 Flash',
  'Claude Opus 4.7',
  'Claude Sonnet 5',
  'Claude Haiku 4.5',
  'GLM 5.2',
  'Kimi K2.6',
  'Claude Sonnet 4.6',
  'GPT-5.5',
  'Grok 4.5',
  'GLM 5.1',
  'DeepSeek V4 Pro',
  'Gemini 3 Flash',
  'Grok 4.20',
];

// ---- Per-tile layout ----------------------------------------------------
// Tile inner SVG dims tuned for ~263px column on 816px page.
const W = 258, H = 106;
const PAD_L = 42, PAD_R = 8, PAD_T = 6, PAD_B = 20;
const innerW = W - PAD_L - PAD_R;
const innerH = H - PAD_T - PAD_B;

const xMin = 0, xMax = 500;
const xS = v => PAD_L + (Math.min(Math.max(v, xMin), xMax) - xMin) / (xMax - xMin) * innerW;

const yMinLog = Math.log10(100);
const yMaxLog = Math.log10(1e8);
const yS = v => {
  if (v <= 0) return PAD_T + innerH;
  const lv = Math.log10(Math.max(v, 100));
  return PAD_T + innerH - (lv - yMinLog) / (yMaxLog - yMinLog) * innerH;
};

// ---- Skull marker (emoji text) -----------------------------------------
function skull(cx, cy, parent) {
  const t = el('text', {
    x: cx, y: cy + 4,
    'text-anchor':'middle',
    'font-size':'12',
    'font-family':'"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',
  }, parent);
  t.textContent = '☠️';
}

// ---- Build one tile per model ------------------------------------------
const grid = document.getElementById('grid');
const page = document.querySelector('.page');
const detailTooltip = document.createElement('div');
detailTooltip.className = 'detail-tooltip';
page.appendChild(detailTooltip);

function formatCash(v) {
  if (v == null || Number.isNaN(v)) return 'ended';
  const sign = v < 0 ? '-' : '';
  const abs = Math.abs(v);
  if (abs >= 1e6) return `${sign}$${(abs / 1e6).toFixed(2).replace(/\.00$/, '')}M`;
  if (abs >= 1e3) return `${sign}$${Math.round(abs / 1e3)}k`;
  return `${sign}$${Math.round(abs)}`;
}

function cashAtDay(series, day) {
  if (series.bankruptDay != null && day >= series.bankruptDay) {
    return { bankrupt: true, value: null };
  }
  const pts = series.pts;
  if (!pts.length || day < pts[0][0] || day > pts[pts.length - 1][0]) {
    return null;
  }
  let lo = 0, hi = pts.length - 1;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (pts[mid][0] === day) return { bankrupt: false, value: pts[mid][1] };
    if (pts[mid][0] < day) lo = mid + 1;
    else hi = mid - 1;
  }
  const left = pts[Math.max(0, hi)];
  const right = pts[Math.min(pts.length - 1, lo)];
  if (!left || !right || left[0] === right[0]) {
    return left ? { bankrupt: false, value: left[1] } : null;
  }
  const t = (day - left[0]) / (right[0] - left[0]);
  return { bankrupt: false, value: left[1] + t * (right[1] - left[1]) };
}

function placeDetailBox(selectedX, preferredTop) {
  const edgeGap = 8;
  const selectionGap = 12;
  const pageWidth = page.clientWidth;
  const pageHeight = page.getBoundingClientRect().height;
  const boxWidth = detailTooltip.offsetWidth;
  const boxHeight = detailTooltip.offsetHeight;
  const rightLeft = selectedX + selectionGap;
  const leftLeft = selectedX - boxWidth - selectionGap;
  let left = rightLeft + boxWidth <= pageWidth - edgeGap ? rightLeft : leftLeft;
  if (left < edgeGap) left = edgeGap;
  if (left + boxWidth > pageWidth - edgeGap) left = pageWidth - boxWidth - edgeGap;

  if (left <= selectedX && selectedX <= left + boxWidth) {
    left = leftLeft >= edgeGap ? leftLeft : rightLeft;
  }

  const maxTop = Math.max(edgeGap, pageHeight - boxHeight - edgeGap);
  const top = Math.max(edgeGap, Math.min(preferredTop, maxTop));
  detailTooltip.style.left = `${left}px`;
  detailTooltip.style.top = `${top}px`;
}

MODEL_ORDER.forEach(modelName => {
  const runs = (RUNS_BY_MODEL[modelName] || []).slice(0, 3);
  const color = (PALETTE[modelName] || {c:'#0a2540'}).c;

  // tile shell
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.innerHTML = `
    <div class="head">
      <span class="name">${modelNameHtml(modelName)}</span>
    </div>
    <div class="body"></div>
  `;
  grid.appendChild(tile);

  const body = tile.querySelector('.body');
  const svg = el('svg', {
    viewBox: `0 0 ${W} ${H}`,
    preserveAspectRatio: 'xMinYMin meet',
    width: W, height: H
  });
  svg.style.display = 'block';
  svg.style.width = '100%';
  body.appendChild(svg);

  // ---- Gridlines (decade majors only) ------------------------------------
  const decades = [100, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8];
  decades.forEach(v => {
    const y = yS(v);
    el('line', { x1: PAD_L, x2: W - PAD_R, y1: y, y2: y,
      stroke: '#d6dde6', 'stroke-width': 0.6, 'stroke-dasharray': '2 3' }, svg);
    const lbl = ({100:'$100', 1e3:'$1k', 1e4:'$10k', 1e5:'$100k', 1e6:'$1M', 1e7:'$10M', 1e8:'$100M'})[v];
    const t = el('text', { x: PAD_L - 4, y: y + 3, class: 'yt', 'text-anchor':'end' }, svg);
    t.textContent = lbl;
  });

  // ---- Axes -----------------------------------------------------------
  const axY = PAD_T + innerH;
  el('line', { x1: PAD_L, x2: PAD_L, y1: PAD_T - 2, y2: axY + 2,
    stroke: '#000000', 'stroke-width': 1 }, svg);
  el('line', { x1: PAD_L - 2, x2: W - PAD_R + 2, y1: axY, y2: axY,
    stroke: '#000000', 'stroke-width': 1 }, svg);

  [0, 100, 200, 300, 400, 500].forEach(v => {
    const x = xS(v);
    el('line', { x1: x, x2: x, y1: axY, y2: axY + 2.5,
      stroke: '#000000', 'stroke-width': 0.8 }, svg);
    const anchor = v === 500 ? 'end' : 'middle';
    const t = el('text', { x, y: axY + 10, class: 'xt', 'text-anchor':anchor }, svg);
    t.textContent = v;
  });

  // x-axis title
  const xLab = el('text', { x: PAD_L + innerW/2, y: H - 3, class:'axt', 'text-anchor':'middle' }, svg);
  xLab.textContent = 'Day';

  // ---- Starting cash reference at $1M ---------------------------------
  {
    const y = yS(1e6);
    el('line', {
      x1: PAD_L, x2: W - PAD_R, y1: y, y2: y,
      stroke: '#000000', 'stroke-width': 0.8, 'stroke-dasharray': '3 2', opacity: 0.55
    }, svg);
  }

  // ---- Plot each run --------------------------------------------------
  // Pre-compute end-of-line / bankruptcy info for label placement.
  const series = runs.map((run, idx) => {
    let bankruptDay = null;
    const pts = [];
    for (const [day, cash] of run.points) {
      if (cash <= 0) {
        bankruptDay = day;
        pts.push([day, 0]);
        break;
      }
      pts.push([day, cash]);
    }
    return {
      idx, run,
      pts,
      bankruptDay,
      dash: RUN_DASH[idx] || '',
      end: pts[pts.length - 1],
    };
  });

  // Draw lines
  series.forEach(s => {
    let d = '';
    s.pts.forEach((p, i) => {
      const x = xS(p[0]), y = yS(p[1]);
      d += (i===0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    });
    el('path', {
      d, fill:'none', stroke: color, 'stroke-width': 1.6,
      'stroke-dasharray': s.dash,
      'stroke-linejoin':'round', 'stroke-linecap':'round',
      opacity: 0.95
    }, svg);
  });

  // Skull markers
  series.forEach(s => {
    if (s.bankruptDay != null) {
      const x = xS(s.bankruptDay);
      const y = yS(0);
      skull(x, y - 6, svg);
    }
  });

  const hoverGroup = el('g', { opacity: '0' }, svg);
  const hoverLine = el('line', {
    y1: PAD_T,
    y2: axY,
    stroke: '#000000',
    'stroke-width': 0.9,
    'stroke-dasharray': '3 3',
    opacity: 0.78
  }, hoverGroup);
  const hoverDots = el('g', {}, hoverGroup);
  const hit = el('rect', {
    x: PAD_L,
    y: PAD_T,
    width: innerW,
    height: innerH,
    fill: 'transparent',
    'pointer-events': 'all'
  }, svg);

  function updateDetails(event) {
    const svgRect = svg.getBoundingClientRect();
    const pageRect = page.getBoundingClientRect();
    const sx = W / svgRect.width;
    const rawX = (event.clientX - svgRect.left) * sx;
    const day = Math.max(xMin, Math.min(xMax, Math.round((rawX - PAD_L) / innerW * xMax)));
    const xx = xS(day);

    hoverGroup.setAttribute('opacity', '1');
    hoverLine.setAttribute('x1', xx);
    hoverLine.setAttribute('x2', xx);
    hoverDots.innerHTML = '';

    const values = series.map(s => {
      const reading = cashAtDay(s, day);
      if (!reading) return null;
      if (!reading.bankrupt) {
        el('circle', {
          cx: xx,
          cy: yS(reading.value),
          r: 2.5,
          fill: color,
          stroke: '#ffffff',
          'stroke-width': 0.9
        }, hoverDots);
      }
      return {
        label: `Run ${s.idx + 1}`,
        value: reading.value,
        bankrupt: reading.bankrupt,
        bankruptDay: s.bankruptDay,
      };
    }).filter(Boolean);

    detailTooltip.innerHTML = `
      <div class="detail-title">${modelNameHtml(modelName)} · Day ${day}</div>
      ${values.map(item => `
        <div class="detail-row">
          <span class="detail-dot" style="background:${color}"></span>
          <span class="detail-name">${item.label}</span>
          <span class="detail-value">${item.bankrupt ? `bankrupt d${item.bankruptDay}` : formatCash(item.value)}</span>
        </div>
      `).join('')}
    `;

    const selectedX = svgRect.left - pageRect.left + (xx / W) * svgRect.width;
    const preferredTop = svgRect.top - pageRect.top + 8;
    placeDetailBox(selectedX, preferredTop);
    detailTooltip.classList.add('visible');
  }

  hit.addEventListener('pointermove', updateDetails);
  hit.addEventListener('pointerenter', updateDetails);
  hit.addEventListener('pointerleave', () => {
    hoverGroup.setAttribute('opacity', '0');
    detailTooltip.classList.remove('visible');
  });

});
</script>

</body>
</html>
