<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO-Bench Agent Complexity</title>
<style>
  :root {
    --ink: #0a2540;
    --line: #aeb9c5;
    --panel: #edf8f1;
    --bg: #ffffff;
    --blue: #2f6df6;
    --cyan: #0c6fa6;
    --green: #00875a;
    --orange: #ed5b2c;
    --amber: #b15c00;
    --pink: #b8326b;
    --purple: #6b3fc8;
  }

  html,
  body {
    margin: 0;
    width: 648px;
    height: 486px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  * {
    box-sizing: border-box;
  }

  .figure {
    position: relative;
    width: 648px;
    height: 486px;
    overflow: hidden;
    background: var(--bg);
  }

  .connectors {
    position: absolute;
    inset: 0;
    width: 648px;
    height: 486px;
    pointer-events: none;
  }

  .connectors line {
    stroke: var(--line);
    stroke-width: 1.8;
    stroke-linecap: round;
  }

  .symbol-defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }

  .node,
  .agent-card {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 0 0 0 1px rgba(10, 37, 64, 0.02);
  }

  .node {
    gap: 10px;
    height: var(--h, 48px);
    width: var(--w, 126px);
    left: var(--x);
    top: var(--y);
    border-radius: 999px;
    padding: 0 16px;
    font-size: var(--fs, 15px);
    font-weight: 520;
    line-height: 1.06;
    letter-spacing: 0;
    text-align: left;
    white-space: normal;
  }

  .node .icon {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    color: var(--icon, var(--blue));
    stroke: currentColor;
    fill: none;
    stroke-width: 2.15;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .agent-card {
    left: 260px;
    top: 184px;
    width: 128px;
    height: 128px;
    border-radius: 26px;
    flex-direction: column;
    gap: 8px;
    z-index: 3;
  }

  .agent-icon {
    display: block;
    width: 58px;
    height: 58px;
    object-fit: contain;
  }

  .agent-label {
    font-size: 32px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: 0;
    color: #000000;
  }

  .n-marketing { --x: 22px; --y: 41px; --w: 128px; --icon: var(--amber); }
  .n-growth { --x: 166px; --y: 17px; --w: 108px; --icon: var(--amber); }
  .n-research { --x: 300px; --y: 6px; --w: 110px; --icon: var(--green); }
  .n-development { --x: 430px; --y: 34px; --w: 146px; --icon: var(--cyan); }
  .n-competitors { --x: 516px; --y: 95px; --w: 126px; --fs: 14px; --icon: var(--orange); }
  .n-economy { --x: 22px; --y: 116px; --w: 112px; --icon: var(--amber); }
  .n-pricing { --x: 141px; --y: 101px; --w: 101px; --icon: var(--blue); }
  .n-shocks { --x: 376px; --y: 99px; --w: 136px; --h: 52px; --icon: var(--orange); }
  .n-product { --x: 444px; --y: 181px; --w: 148px; --h: 52px; --icon: var(--cyan); }
  .n-support { --x: 62px; --y: 197px; --w: 143px; --h: 52px; --icon: var(--amber); }
  .n-infra { --x: 50px; --y: 292px; --w: 146px; --icon: var(--purple); }
  .n-market-research { --x: 520px; --y: 272px; --w: 120px; --h: 52px; --icon: var(--green); }
  .n-analytics { --x: 34px; --y: 405px; --w: 126px; --icon: var(--blue); }
  .n-reputation { --x: 169px; --y: 400px; --w: 128px; --icon: var(--pink); }
  .n-social { --x: 450px; --y: 340px; --w: 132px; --h: 52px; --icon: var(--pink); }
  .n-enterprise { --x: 306px; --y: 382px; --w: 142px; --h: 52px; --icon: var(--green); }
  .n-budgeting { --x: 470px; --y: 426px; --w: 126px; --icon: var(--amber); }
  .n-cash { --x: 300px; --y: 436px; --w: 112px; --icon: var(--amber); }
</style>
</head>
<body>
<div class="figure" role="img" aria-label="CEO-Bench agent coordinating pricing, growth, product, operations, communication, sales, and external market factors">
  <svg class="symbol-defs" aria-hidden="true">
    <symbol id="icon-megaphone" viewBox="0 0 24 24">
      <path d="M4 13v-3l12-4v11L4 13z"></path>
      <path d="M4 13l2 6h3l-1.5-5"></path>
      <path d="M18 9.5l2-1.5"></path>
      <path d="M18 13.5l2 1.5"></path>
    </symbol>
    <symbol id="icon-trend" viewBox="0 0 24 24">
      <path d="M4 17h16"></path>
      <path d="M5 14l5-5 4 4 5-7"></path>
      <path d="M15 6h4v4"></path>
    </symbol>
    <symbol id="icon-flask" viewBox="0 0 24 24">
      <path d="M9 3h6"></path>
      <path d="M10 3v6l-5 8a3 3 0 0 0 2.6 4.5h8.8A3 3 0 0 0 19 17l-5-8V3"></path>
      <path d="M7 16h10"></path>
    </symbol>
    <symbol id="icon-code" viewBox="0 0 24 24">
      <path d="M8 8l-4 4 4 4"></path>
      <path d="M16 8l4 4-4 4"></path>
      <path d="M13 5l-2 14"></path>
    </symbol>
    <symbol id="icon-timer" viewBox="0 0 24 24">
      <path d="M10 2h4"></path>
      <path d="M12 14V9"></path>
      <path d="M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
      <path d="M5 5l2 2"></path>
      <path d="M19 5l-2 2"></path>
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M3 12h18"></path>
      <path d="M12 3c2.3 2.4 3.4 5.4 3.4 9S14.3 18.6 12 21"></path>
      <path d="M12 3c-2.3 2.4-3.4 5.4-3.4 9s1.1 6.6 3.4 9"></path>
    </symbol>
    <symbol id="icon-tag" viewBox="0 0 24 24">
      <path d="M20 12L12 20 4 12V4h8l8 8z"></path>
      <circle cx="8.5" cy="8.5" r="1.2"></circle>
    </symbol>
    <symbol id="icon-zap" viewBox="0 0 24 24">
      <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9L12 3z"></path>
    </symbol>
    <symbol id="icon-headset" viewBox="0 0 24 24">
      <path d="M4 13a8 8 0 0 1 16 0"></path>
      <path d="M4 13v4a2 2 0 0 0 2 2h1v-7H6a2 2 0 0 0-2 1z"></path>
      <path d="M20 13v4a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 1z"></path>
      <path d="M15 20h-3"></path>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="4" y="5" width="16" height="6" rx="2"></rect>
      <rect x="4" y="14" width="16" height="6" rx="2"></rect>
      <path d="M8 8h.1"></path>
      <path d="M8 17h.1"></path>
      <path d="M11 8h5"></path>
      <path d="M11 17h5"></path>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"></circle>
      <path d="M16 16l5 5"></path>
    </symbol>
    <symbol id="icon-bars" viewBox="0 0 24 24">
      <path d="M4 20h16"></path>
      <path d="M7 17V9"></path>
      <path d="M12 17V5"></path>
      <path d="M17 17v-6"></path>
    </symbol>
    <symbol id="icon-message-heart" viewBox="0 0 24 24">
      <path d="M5 5h14v10H9l-4 4V5z"></path>
      <path d="M12 12.5l-2.1-2.1a2 2 0 0 1 2.8-2.8L12 8.3l.7-.7a2 2 0 0 1 2.8 2.8L12 12.5z"></path>
    </symbol>
    <symbol id="icon-building" viewBox="0 0 24 24">
      <path d="M6 21V7l6-4 6 4v14"></path>
      <path d="M9 21v-6h6v6"></path>
      <path d="M9 10h.1"></path>
      <path d="M15 10h.1"></path>
      <path d="M12 8v4"></path>
    </symbol>
    <symbol id="icon-receipt" viewBox="0 0 24 24">
      <path d="M6 3h12v18l-2-1-2 1-2-1-2 1-2-1-2 1V3z"></path>
      <path d="M9 8h6"></path>
      <path d="M9 12h6"></path>
      <path d="M9 16h4"></path>
    </symbol>
    <symbol id="icon-cash" viewBox="0 0 24 24">
      <path d="M4 20h16"></path>
      <path d="M7 18V8"></path>
      <path d="M7 14l4-4 3 3 5-6"></path>
      <path d="M18 7h1v4"></path>
    </symbol>
  </svg>

  <svg class="connectors" viewBox="0 0 648 486" aria-hidden="true">
    <line x1="86" y1="65" x2="324" y2="248"></line>
    <line x1="220" y1="39" x2="324" y2="248"></line>
    <line x1="355" y1="28" x2="324" y2="248"></line>
    <line x1="503" y1="58" x2="324" y2="248"></line>
    <line x1="581" y1="119" x2="324" y2="248"></line>
    <line x1="78" y1="140" x2="324" y2="248"></line>
    <line x1="192" y1="123" x2="324" y2="248"></line>
    <line x1="444" y1="125" x2="324" y2="248"></line>
    <line x1="518" y1="207" x2="324" y2="248"></line>
    <line x1="134" y1="223" x2="324" y2="248"></line>
    <line x1="123" y1="316" x2="324" y2="248"></line>
    <line x1="580" y1="298" x2="324" y2="248"></line>
    <line x1="97" y1="429" x2="324" y2="248"></line>
    <line x1="233" y1="424" x2="324" y2="248"></line>
    <line x1="516" y1="366" x2="324" y2="248"></line>
    <line x1="377" y1="408" x2="324" y2="248"></line>
    <line x1="533" y1="450" x2="324" y2="248"></line>
    <line x1="356" y1="460" x2="324" y2="248"></line>
  </svg>

  <div class="node n-marketing"><svg class="icon"><use href="#icon-megaphone"></use></svg><span>Marketing</span></div>
  <div class="node n-growth"><svg class="icon"><use href="#icon-trend"></use></svg><span>Growth</span></div>
  <div class="node n-research"><svg class="icon"><use href="#icon-flask"></use></svg><span>Research</span></div>
  <div class="node n-development"><svg class="icon"><use href="#icon-code"></use></svg><span>Development</span></div>
  <div class="node n-competitors"><svg class="icon"><use href="#icon-timer"></use></svg><span>Competitors</span></div>
  <div class="node n-economy"><svg class="icon"><use href="#icon-globe"></use></svg><span>Economy</span></div>
  <div class="node n-pricing"><svg class="icon"><use href="#icon-tag"></use></svg><span>Pricing</span></div>
  <div class="node n-shocks"><svg class="icon"><use href="#icon-zap"></use></svg><span>Market<br>Shocks</span></div>
  <div class="node n-product"><svg class="icon"><use href="#icon-star"></use></svg><span>Product<br>Quality</span></div>
  <div class="node n-support"><svg class="icon"><use href="#icon-headset"></use></svg><span>Customer<br>Support</span></div>
  <div class="node n-infra"><svg class="icon"><use href="#icon-server"></use></svg><span>Infrastructure</span></div>
  <div class="node n-market-research"><svg class="icon"><use href="#icon-search"></use></svg><span>Market<br>Research</span></div>
  <div class="node n-analytics"><svg class="icon"><use href="#icon-bars"></use></svg><span>Analytics</span></div>
  <div class="node n-reputation"><svg class="icon"><use href="#icon-star"></use></svg><span>Reputation</span></div>
  <div class="node n-social"><svg class="icon"><use href="#icon-message-heart"></use></svg><span>Social<br>Media</span></div>
  <div class="node n-enterprise"><svg class="icon"><use href="#icon-building"></use></svg><span>Enterprise<br>Sales</span></div>
  <div class="node n-budgeting"><svg class="icon"><use href="#icon-receipt"></use></svg><span>Budgeting</span></div>
  <div class="node n-cash"><svg class="icon"><use href="#icon-cash"></use></svg><span>Cash<br>Flow</span></div>

  <div class="agent-card" aria-hidden="true">
    <img class="agent-icon" src="assets/llm-agent-icon.png" alt="">
    <div class="agent-label">Agent</div>
  </div>
</div>
</body>
</html>
